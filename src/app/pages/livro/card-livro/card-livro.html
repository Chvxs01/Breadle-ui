<a
  class="livro-card"
  [class.ativo]="ativo()"
  [routerLink]="['/livro/detalhes', livro().id]"
  [attr.aria-label]="livro().titulo + (indisponivel() ? ' (indisponível)' : '')"
  (mouseenter)="destacar.emit(livro())"
  (focus)="destacar.emit(livro())"
>
  <img [src]="livro().capaUrl" alt="">

  @if (indisponivel()) {
    <i class="bi bi-lock-fill cadeado" aria-hidden="true"></i>
  }
</a>
