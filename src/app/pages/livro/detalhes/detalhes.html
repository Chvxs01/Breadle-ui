<app-container>

  <main class="detalhes-livro">

    <section class="informacoes">

      <div class="avaliacao" role="img" aria-label="Avaliação: 4 de 5 estrelas">
        <i class="bi bi-star-fill" aria-hidden="true"></i>
        <i class="bi bi-star-fill" aria-hidden="true"></i>
        <i class="bi bi-star-fill" aria-hidden="true"></i>
        <i class="bi bi-star-fill" aria-hidden="true"></i>
        <i class="bi bi-star" aria-hidden="true"></i>
      </div>

      <div class="informacoes-basicas">
        <span>{{ livro.dataPublicacao?.getFullYear() }}</span>
        <span>{{ livro.autor }}</span>
      </div>

      @if (livro.paginas) {
        <div class="paginas">
          <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
          <span>{{ livro.paginas }} páginas</span>
        </div>
      }

      @for (paragrafo of livro.descricao; track $index) {
        <p class="descricao">{{ paragrafo }}</p>
      }

      <div class="acoes-avaliacao">
        <button type="button" aria-label="Gostei">
          <i class="bi bi-hand-thumbs-up" aria-hidden="true"></i>
        </button>

        <button type="button" aria-label="Não gostei">
          <i class="bi bi-hand-thumbs-down" aria-hidden="true"></i>
        </button>
      </div>

      <div class="acoes-livro">

        <button type="button">
          <i class="bi bi-play" aria-hidden="true"></i>
          <span>Continuar leitura pg {{ paginaAtual }}</span>
        </button>

        <button type="button">
          <i class="bi bi-rewind-fill" aria-hidden="true"></i>
          <span>Reiniciar leitura</span>
        </button>

        <button type="button">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>
          <span>Adicionar a minha Livraria</span>
        </button>

        <button type="button">
          <i class="bi bi-book" aria-hidden="true"></i>
          <span>Ver coleção</span>
        </button>

        <button type="button">
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <span>Saber mais sobre o autor</span>
        </button>

        <button type="button">
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Baixar o livro</span>
        </button>

      </div>

    </section>

    <section class="capa-livro">
      <app-capa-livro
        [src]="livro.capaUrl"
        [titulo]="livro.titulo">
      </app-capa-livro>
    </section>

  </main>

</app-container>
