<section class="login-page">

  <img class="login-logo" src="logo.png" alt="Breadle">

  <form class="login-card" [formGroup]="form" (ngSubmit)="cadastrar()" novalidate>

    <div class="campo">
      <label for="nome">Nome:</label>
      <input id="nome" type="text" formControlName="nome" autocomplete="name"
             [class.invalido]="invalido('nome')">
      @if (invalido('nome')) { <small class="msg-erro">Informe seu nome.</small> }
    </div>

    <div class="campo">
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email" autocomplete="email"
             [class.invalido]="invalido('email')">
      @if (invalido('email')) { <small class="msg-erro">Informe um e-mail válido.</small> }
    </div>

    <div class="campo">
      <label for="senha">Senha:</label>
      <input id="senha" type="password" formControlName="senha" autocomplete="new-password"
             [class.invalido]="invalido('senha')">
      @if (invalido('senha')) { <small class="msg-erro">A senha deve ter pelo menos 6 caracteres.</small> }
    </div>

    <div class="campo">
      <label for="confirmar">Confirmar senha:</label>
      <input id="confirmar" type="password" formControlName="confirmar" autocomplete="new-password"
             [class.invalido]="invalido('confirmar') || (enviado() && form.hasError('senhasDiferentes'))">
      @if (enviado() && form.hasError('senhasDiferentes')) {
        <small class="msg-erro">As senhas não coincidem.</small>
      }
    </div>

    @if (erro()) {
      <p class="erro-geral" role="alert">{{ erro() }}</p>
    }

    <button class="btn-login" type="submit">Cadastrar</button>

    <a class="esqueci" routerLink="/login">Já tenho conta</a>

  </form>

</section>
